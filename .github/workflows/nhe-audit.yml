name: NHE workbook reproduction
on:
  push:
    paths:
      - '.github/workflows/nhe-audit.yml'
      - 'nhe-analysis/audit-2026/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl numpy pandas matplotlib scipy
      - run: python nhe-analysis/audit-2026/inspect_workbooks.py
      - run: python nhe-analysis/audit-2026/inspect_rows.py
      - run: python nhe-analysis/audit-2026/reproduce.py
      - run: python nhe-analysis/audit-2026/reproduce_workbooks.py
      - name: Commit verified generated audit outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nhe-analysis/audit-2026/results/ nhe-analysis/audit-2026/figures/
          if ! git diff --cached --quiet; then
            git commit -m 'Add generated workbook reproduction outputs [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhe-workbook-reproduction
          path: |
            nhe-analysis/audit-2026/results/
            nhe-analysis/audit-2026/figures/
